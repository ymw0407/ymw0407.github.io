<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f7f7f2">
    <title>404 · 페이지를 찾을 수 없습니다 | sinav</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light; background: #f7f7f2; color: #18251f; font: 16px/1.5 system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { max-width: 84rem; margin: auto; padding: 0 clamp(1.25rem, 6vw, 6rem); }
      a { color: inherit; text-decoration: none; }
      a:focus-visible { outline: 3px solid #225aaf; outline-offset: 5px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      header { border-bottom: 1px solid #bac3b9; padding: 1.3rem 0; }
      .brand { display: inline-flex; align-items: center; gap: .6rem; font: 650 1.25rem system-ui; }
      .mono { font: 500 .76rem/1.5 ui-monospace, monospace; letter-spacing: .04em; }
      main { display: grid; grid-template-columns: .86fr 1.14fr; align-items: center; gap: clamp(2rem, 5vw, 5rem); padding: clamp(3rem, 9vh, 7rem) 0; border-bottom: 1px solid #bac3b9; }
      .code { display: block; font: 500 clamp(6.5rem, 14vw, 12.5rem)/.9 system-ui; letter-spacing: -.075em; margin-left: -.06em; }
      h1 { margin: 1.6rem 0 .7rem; font-size: clamp(1.55rem, 2.7vw, 2.6rem); line-height: 1.25; letter-spacing: -.06em; word-break: keep-all; }
      #path { color: #536057; font: .85rem/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
      nav { display: flex; align-items: center; flex-wrap: wrap; gap: 1.5rem; margin-top: 2.25rem; }
      nav a { display: inline-flex; align-items: center; gap: .85rem; padding: .7rem 0; font-weight: 650; }
      .home { border-radius: .4rem; background: #1c352a; color: white; padding: .7rem 1.15rem; }
      .home:hover { background: #2d543f; }
      .text-link:hover { text-decoration: underline; text-underline-offset: .22em; }
      figure { min-width: 0; margin: 0; }
      .photo { display: block; width: 100%; aspect-ratio: 5/4; object-fit: cover; border-radius: .3rem; }
      figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem; margin-top: .65rem; font-size: .8rem; color: #48564d; }
      :root[lang="ko"] [lang="en"], :root[lang="en"] [lang="ko"] { display: none; }
      @media (max-width: 700px) {
        main { grid-template-columns: 1fr; gap: 2.5rem; padding: 2.75rem 0 1.75rem; }
        .photo { aspect-ratio: 1.85; }
        nav { margin-top: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/"><img src="/favicon.svg" width="33" height="33" alt="">sinav</a>
      <span class="mono"><span lang="ko">윤민우</span><span lang="en">Minwoo Yun</span></span>
    </header>
    <main>
      <section>
        <span class="code">404</span>
        <h1><span lang="ko">페이지를 찾을 수 없습니다</span><span lang="en">Page not found</span></h1>
        <code id="path"></code>
        <nav>
          <a class="home" href="/"><span aria-hidden="true">←</span><span lang="ko">홈으로</span><span lang="en">Home</span></a>
          <a class="text-link" href="/blog"><span lang="ko">블로그 글 목록</span><span lang="en">Browse the blog</span><span aria-hidden="true">→</span></a>
        </nav>
      </section>
      <figure>
        <img class="photo" src="/photography/2026-weather-aurora-curtain.jpg" width="1600" height="1066" style="height:auto" alt="">
        <figcaption>
          <span><span lang="ko">숲 위의 오로라 커튼</span><span lang="en">Aurora Curtain Above the Forest</span></span>
          <a class="text-link" href="/archive"><span lang="ko">사진 아카이브</span><span lang="en">Photo archive</span> ↗</a>
        </figcaption>
      </figure>
    </main>
    <script>
      // Remove only the empty query fragments accumulated by the old 404 loop.
      if (/^\?\/(?:&\/(?:~and~\/)*)?$/.test(location.search)) {
        const clean = new URL(location.href);
        clean.search = '';
        history.replaceState(history.state, '', clean);
      }
      document.getElementById('path').textContent = location.pathname;
      let lang = navigator.language.toLowerCase().startsWith('ko') ? 'ko' : 'en';
      try {
        const saved = localStorage.getItem('mw_lang');
        if (saved === 'ko' || saved === 'en') lang = saved;
      } catch { /* Storage can be disabled in embedded browsers. */ }
      document.documentElement.lang = lang;
      if (lang === 'en') document.title = '404 · Page not found | sinav';
    </script>
  </body>
</html>

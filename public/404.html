<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Converts path into query string so index.html can restore clean URLs via history.replaceState
      var pathSegmentsToKeep = window.location.hostname.endsWith('.github.io') &&
        window.location.pathname.split('/').filter(Boolean).length > 0 &&
        !['posts', 'portfolio', 'research', 'publications', 'projects', 'archive'].includes(
          window.location.pathname.split('/').filter(Boolean)[0]
        )
        ? 1
        : 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
